spring:
  profiles:
    active: local
    include: secret
  jpa:
    defer-datasource-initialization: true
    # 기본값(true)을 명시해 기동 경고를 없앤다. 컨트롤러에서 지연 로딩을 쓰는 곳이 있어 그대로 둔다.
    open-in-view: true
    properties:
      hibernate:
        auto_quote_keyword: true
  servlet:
    multipart:
      enabled: true
      location: /var/attachments/temp/
      max-request-size: 100MB
      max-file-size: 100MB
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - email
              - profile
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
          github:
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
          facebook:
            scope:
              - email
              - public_profile
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
          naver:
            scope:
              - nickname
              - email
              - profile_image
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            client-name: Naver
          kakao:
            scope:
              - profile_nickname
              - profile_image
              - account_email
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            client-name: Kakao
          discord:
            scope:
              - identify
              - email
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            client-name: Discord
          microsoft:
            scope:
              - https://graph.microsoft.com/User.Read
            redirect-uri: '{baseUrl}/api/v1/authentication/oauth2/code/{registrationId}'
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            client-name: Microsoft
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          discord:
            authorization-uri: https://discord.com/api/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
          microsoft:
            authorization-uri: https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/consumers/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/v1.0/me
            user-name-attribute: id
server:
  tomcat:
    use-relative-redirects: true
  forward-headers-strategy: native

# 메일 발송: Resend HTTP API (https://resend.com). api-key 는 운영 VM 의 application-secret.yml 에 두고, 비어 있으면 spring.mail(SMTP) 로 보낸다.
mail:
  resend:
    api-key: ${RESEND_API_KEY:}
    # 보내는 주소의 도메인은 Resend 에 인증돼 있어야 한다 (kimhwan.kr 은 Proxmox 알림용으로 이미 인증됨)
    from: "Hwan'Story <noreply@kimhwan.kr>"
attachments:
  path: /var/attachments/
blog:
  # RSS 피드의 item link 및 guid 생성, 기기 로그인 승인 주소(/device)에 사용할 블로그 웹 주소
  web-base-url: https://hwanstory.kr
  # 에이전트 가이드(/agents.md)와 도우미 스크립트에 채워 넣을 이 API 서버의 공개 주소
  api-base-url: https://api.hwanstory.kr
  access-token:
    # 기기 로그인으로 발급되는 토큰의 기본 만료 일수 (승인할 때 바꿀 수 있음, 0 = 무기한)
    default-days: 30
    # 기기 로그인 코드의 유효 시간 (분)
    device-code-minutes: 10
  rss:
    title: Hwan'Story
    description: 직접 만든 블로그 서비스.