spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 인메모리 H2. (파일 DB ~/test 는 H2 버전이 바뀌면 "Unsupported database file version" 으로 열리지 않아 인메모리로 바꿈, 2026-11-06)
    url: jdbc:h2:mem:hwanstory;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      path: /h2-console
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 'id'
            client-secret: 'secret'
          github:
            client-id: 'id'
            client-secret: 'secret'
          facebook:
            client-id: 'id'
            client-secret: 'secret'
          naver:
            client-id: 'id'
            client-secret: 'secret'
          kakao:
            client-id: 'id'
            client-secret: 'secret'
          discord:
            client-id: 'id'
            client-secret: 'secret'
          microsoft:
            client-id: 'id'
            client-secret: 'secret'
jwt:
  base64-access-secret: 4324e295ed33679e1512b77e4d47f555ef74c6408a768f506af7e88acd2951e9
  base64-refresh-secret: 4324e295ed33679e1512b77e4d47f555ef74c6408a768f506af7e88acd2951e9
  base64-register-secret: 4324e295ed33679e1512b77e4d47f555ef74c6408a768f506af7e88acd2951e9
logging:
  level:
    root: info
    org:
      hibernate:
        type:
          descriptor:
            sql: trace
blog:
  web-base-url: http://localhost:8081
  api-base-url: http://localhost:8080
allowedOrigins: 'http://localhost:8081'