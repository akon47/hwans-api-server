# Secrets (datasource url/username/password, redis, oauth2 client ids/secrets, jwt keys, mail login) are NOT in the image.
# They come from /config/application-secret.yml on the server (profile 'secret', mounted from /home/kimhwan/blog-config).
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: update
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
allowedOrigins: 'https://hwanstory.kr'