plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hwans'
version = '0.0.1-SNAPSHOT'

java {
	// 컴파일·실행 JDK 를 툴체인으로 고정한다. 로컬이나 Jenkins 에 21 이 없으면 settings.gradle 의 foojay 플러그인이 내려받는다.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 관리자 시스템 화면에 버전·빌드 시각을 보여주기 위한 build-info.properties
springBoot {
    buildInfo()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// Boot 2 → 3 에서 이름이 바뀐 설정 키(spring.redis.* → spring.data.redis.* 등)를 기동 시 옮겨 준다.
	// 운영 VM 의 application-secret.yml 이 옛 키를 쓰고 있어도 동작한다. 그 파일을 정리한 뒤에는 빼도 된다.
	runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

	// OpenAPI 문서 (Springfox 대체): /swagger-ui/index.html, /v3/api-docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Tika (첨부파일 MIME 타입 → 확장자)
	implementation 'org.apache.tika:tika-core:3.3.3'

	// Markdown → HTML + HTML 정화 (검색엔진 크롤러용 서버 렌더 페이지 /prerender)
	implementation 'org.commonmark:commonmark:0.32.0'
	implementation 'org.commonmark:commonmark-ext-gfm-tables:0.32.0'
	implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.32.0'
	implementation 'org.commonmark:commonmark-ext-autolink:0.32.0'
	implementation 'org.commonmark:commonmark-ext-task-list-items:0.32.0'
	implementation 'org.jsoup:jsoup:1.24.1'

	// Embedded Redis for Local Development (local 프로파일에서만 기동)
	implementation 'com.github.codemonstur:embedded-redis:1.4.4'

	// H2 Database for Local Development
	runtimeOnly 'com.h2database:h2'

	// Log
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}
